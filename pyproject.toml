[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macverify"
version = "1.1.0"
description = "Read-only, offline inventory of a macOS user space and its AI assistant configuration"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Shane Dixon" }]
keywords = ["macos", "audit", "inventory", "read-only", "offline", "claude-code", "copilot", "codex"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ShanedixonGit/macverify"
Source = "https://github.com/ShanedixonGit/macverify"
Issues = "https://github.com/ShanedixonGit/macverify/issues"

[project.scripts]
macverify = "macverify.__main__:main"

[tool.setuptools]
packages = ["macverify", "macverify.collectors"]

[tool.setuptools.package-data]
macverify = []
