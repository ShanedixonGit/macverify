name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm the tag matches the declared version
        if: github.event_name == 'release'
        run: |
          declared=$(grep -m1 -E '^\s*version\s*=' pyproject.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject: $declared   tag: $tag"
          test "$declared" = "$tag" || (echo "tag $GITHUB_REF_NAME does not match pyproject version $declared" >&2; exit 1)

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/macverify
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
